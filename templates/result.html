<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <div class="card result-card">
            <div class="header-section">
                <h1 class="title">Assessment Report</h1>
                <p class="subtitle">Generated by AI Diagnostic Model</p>
            </div>

            <div class="result-box">
                <div class="result-icon {{ result_class }}">
                    {% if result_class == 'danger' %}
                        ⚠️
                    {% else %}
                        ✅
                    {% endif %}
                </div>

                <h2 class="prediction-text {{ result_class }}">{{ prediction }}</h2>
                <p class="probability-text">Confidence Score: <strong>{{ probability }}</strong></p>
            </div>

            <div style="text-align: center;">
                <a href="/" class="btn-back">← New Assessment</a>
            </div>
        </div>
    </div>

</body>
</html>
